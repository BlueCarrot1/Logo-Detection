# 模型设置，参数设置参考 trl.ModelConfig
model_name_or_path: /root/autodl-tmp/model/qwen2.5_vl_3b_instruct
auto_model_class: "Qwen2_5_VLForConditionalGeneration"
torch_dtype: bfloat16

# 数据集设置，参数设置参考 sft_docvqa.DataTrainingArguments
train_dataset_name: /root/autodl-tmp/train/anker/train_v2.jsonl
test_dataset_name: /root/autodl-tmp/train/anker/train_v2.jsonl
data_collator: "Qwen2_5VLCollator"
max_seq_length: 1024
max_image_side: 512

# 训练设置，参数设置参考 transformers.TrainingArguments trl.SFTConfig
## 训练超参数
seed: 2025
data_seed: 2025
remove_unused_columns: False  # 此处需要指定为false
## batchsize、训练次数相关
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
num_train_epochs: 5
## 学习率相关
learning_rate: 1.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.1
## 训练效率相关
gradient_checkpointing: false
bf16: true
bf16_full_eval: true
## 验证输出
eval_strategy: epoch
eval_steps: 0.1
## 结果输出+日志日志设置
output_dir: /root/autodl-tmp/output1_epoch5_lora_2_resize
save_strategy: epoch
report_to: swanlab
logging_first_step: true
logging_steps: 0.001
